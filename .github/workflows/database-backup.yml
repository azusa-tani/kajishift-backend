name: Database backup and restore drill

on:
  schedule:
    - cron: '0 18 * * *'
    - cron: '30 19 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      OPS_ALERT_WEBHOOK_URLS: ${{ secrets.OPS_ALERT_WEBHOOK_URLS }}
      BACKUP_RETENTION_COUNT: '7'
      PG_DUMP_PATH: /usr/lib/postgresql/18/bin/pg_dump
      PG_RESTORE_PATH: /usr/lib/postgresql/18/bin/pg_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          "$PG_DUMP_PATH" --version
          "$PG_RESTORE_PATH" --version
      - name: Install dependencies
        run: npm ci
      - name: Create encrypted backup
        run: npm run backup:database
      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: kajishift-db-backup
          path: backups/
          retention-days: 7

  weekly-restore-drill:
    if: github.event.schedule == '30 19 * * 0' || github.event_name == 'workflow_dispatch'
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      RESTORE_DRILL_CONFIRM: verification-db
      PG_RESTORE_PATH: /usr/lib/postgresql/18/bin/pg_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          "$PG_RESTORE_PATH" --version
      - name: Install dependencies
        run: npm ci
      - name: Download backup artifact
        uses: actions/download-artifact@v4
        with:
          name: kajishift-db-backup
          path: backups/
      - name: Inspect downloaded backup artifact
        shell: bash
        run: |
          set -euo pipefail
          find backups -maxdepth 3 -type f -print -exec ls -lh {} \;
      - name: Run restore drill against verification DB
        shell: bash
        run: |
          set -euo pipefail
          latest_backup="$(find backups -type f \( -name '*.dump.enc' -o -name '*.dump' \) -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$latest_backup" ]; then
            echo "No backup artifact found under backups/"
            exit 1
          fi
          echo "Using backup artifact: $latest_backup"
          npm run backup:restore-drill -- "$latest_backup"
